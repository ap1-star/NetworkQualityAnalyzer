name: Deploy ECE Recruitment Radar to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'ece-recruitment-radar/**'
      - '.github/workflows/deploy-ece-recruitment-radar.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare standalone dashboard site
        run: |
          mkdir -p _site/data
          cp ece-recruitment-radar/index.html _site/index.html
          cp ece-recruitment-radar/data/sources.json _site/data/sources.json
          cp ece-recruitment-radar/data/live-notices.json _site/data/live-notices.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
